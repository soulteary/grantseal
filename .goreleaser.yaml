# goreleaser configuration for grantseal (github.com/soulteary/grantseal).
# goreleaser v2 syntax.
#
# NOTE ON DEPRECATION WARNINGS: `dockers`, `docker_manifests` and `brews` are
# marked deprecated by goreleaser, but their replacements (`dockers_v2` and
# `homebrew_casks`) are GoReleaser Pro-only. On the free/OSS edition these
# sections remain the supported way to build multi-arch images and Homebrew
# packages, and they keep working for the entire v2 series (only removed in a
# future v3). `goreleaser release` only warns; `goreleaser check` exits non-zero
# on any deprecation, so do NOT gate CI on `goreleaser check` here — the release
# workflow runs `release --clean`, which is unaffected by these warnings.
version: 2

project_name: grantseal

before:
  hooks:
    # grantseal has zero third-party dependencies; tidy is a cheap sanity check.
    - go mod tidy

builds:
  - id: license-tool
    main: ./cmd/license-tool
    binary: license-tool
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w strips debug info; main.version is the CLI version variable
      # declared in cmd/license-tool/version.go.
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: license-tool
    ids:
      - license-tool
    # Use tar.gz everywhere except Windows, which gets a zip.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Build/verify/publish atomicity (P1-3): create the GitHub Release as a DRAFT so
# the tag, release notes and uploaded assets stay INVISIBLE to consumers until
# the release workflow has verified the built bytes and explicitly promotes the
# draft to published (`gh release edit --draft=false`). If any verification step
# fails the draft is never promoted (and can be discarded), so users never see a
# half-verified release. Image floating tags are only pushed in the publish
# phase, which runs strictly after verification.
release:
  draft: true

# Software Bill of Materials (P1-6). goreleaser invokes syft to emit a CycloneDX
# SBOM per built archive; the resulting *.sbom.json files are attached to the
# GitHub Release as assets. syft must be on PATH in the release runner (the
# release workflow installs it via anchore/sbom-action's installer before
# running goreleaser). SBOM generation is skipped automatically for
# `--snapshot` if syft is absent, so it does not break local snapshot builds.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.cdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

# Keyless signing (P1-6): sign the checksums file AND every archive with cosign
# using GitHub OIDC (no long-lived keys). Signatures + certificates are attached
# to the release. The release workflow installs cosign (pinned) and grants
# `id-token: write` ONLY to the publishing job. COSIGN_YES avoids the
# interactive Fulcio/Rekor consent prompt in CI.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
  - id: archives
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    output: true

# Keyless image signing (P1-6): cosign-sign every pushed image tag (per-arch
# tags and the multi-arch manifest) with GitHub OIDC. Runs only on real
# releases (not snapshots).
docker_signs:
  - id: images
    cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}@${digest}"
    artifacts: all
    output: true

changelog:
  sort: asc
  use: github
  # Group commits by conventional-commit prefix.
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

# Multi-arch container images. Each entry builds a single-arch image; the
# docker_manifests section below stitches them into one multi-arch tag.
dockers:
  - id: license-tool-amd64
    goos: linux
    goarch: amd64
    dockerfile: docker/Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "soulteary/grantseal:{{ .Version }}-amd64"
      - "soulteary/grantseal:{{ .Major }}.{{ .Minor }}-amd64"
      - "soulteary/grantseal:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/grantseal"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: license-tool-arm64
    goos: linux
    goarch: arm64
    dockerfile: docker/Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "soulteary/grantseal:{{ .Version }}-arm64"
      - "soulteary/grantseal:{{ .Major }}.{{ .Minor }}-arm64"
      - "soulteary/grantseal:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/grantseal"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "soulteary/grantseal:{{ .Version }}"
    image_templates:
      - "soulteary/grantseal:{{ .Version }}-amd64"
      - "soulteary/grantseal:{{ .Version }}-arm64"
  - name_template: "soulteary/grantseal:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "soulteary/grantseal:{{ .Major }}.{{ .Minor }}-amd64"
      - "soulteary/grantseal:{{ .Major }}.{{ .Minor }}-arm64"
  - name_template: "soulteary/grantseal:latest"
    image_templates:
      - "soulteary/grantseal:latest-amd64"
      - "soulteary/grantseal:latest-arm64"

# Homebrew formula pushed to the tap repo soulteary/homebrew-tap.
# The binary keeps the name `license-tool`, so the installed command is
# `license-tool` (not `grantseal`).
brews:
  - name: grantseal
    ids:
      - license-tool
    # Non-blocking Homebrew publishing: when HOMEBREW_TAP_TOKEN is unset or
    # empty (e.g. the tap PAT is not configured), skip the push to the tap
    # repo instead of failing the whole release. The formula is still built
    # into dist/homebrew/, and the GitHub Release + Docker images are already
    # published by earlier steps. Set the secret to re-enable tap pushes.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: soulteary
      name: homebrew-tap
      # PAT with write access to the tap repo; provided by release.yml as
      # the HOMEBREW_TAP_TOKEN secret (the default GITHUB_TOKEN cannot push
      # to a different repository). Default to empty so the skip_upload guard
      # above triggers cleanly when the secret is absent.
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    homepage: "https://github.com/soulteary/grantseal"
    description: "grantseal offline license issuer/verifier CLI (license-tool)"
    license: "Apache-2.0"
    install: |
      bin.install "license-tool"
    test: |
      system "#{bin}/license-tool", "version"
