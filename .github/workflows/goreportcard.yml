name: Go Report Card

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only trigger on version tag pushes and manual runs. Committing the generated
# badge back must never re-trigger this workflow, so branch push events are
# intentionally omitted (tag pushes are not produced by the badge commit).

permissions:
  contents: write

# Prevent overlapping runs from committing/overwriting the badge concurrently.
concurrency:
  group: goreportcard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report-card:
    runs-on: ubuntu-latest
    steps:
      # This workflow is triggered by tag pushes (v*), so a default checkout
      # lands on a detached HEAD (the tag's commit) and the badge commit cannot
      # be pushed ("You are not currently on a branch"). Check out the default
      # branch by name so HEAD tracks a branch the badge can be committed back to.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - id: grc
        uses: soulteary/goreportcard-action@v1
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          commit: "true"

      - run: echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"
