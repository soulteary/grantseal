name: Go Report Card

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only trigger on version tag pushes and manual runs. Committing the generated
# badge back must never re-trigger this workflow, so branch push events are
# intentionally omitted (tag pushes are not produced by the badge commit).

# Default to read-only; only the restricted write-back job opts into write.
permissions:
  contents: read

env:
  CI_RECIPES_VERSION: 5f68a250b274f4673879e219c9906a91f594dd1e

jobs:
  report-card-generate:
    name: report card (generate, no write)
    runs-on: ubuntu-latest
    # The report-generating Action runs strictly read-only: it must never hold
    # contents: write. It produces the badge svg; a separate restricted job
    # commits it.
    permissions:
      contents: read
    steps:
      # This workflow is triggered by tag pushes (v*); check out the default
      # branch by name so the badge is generated against branch state.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - id: grc
        uses: soulteary/goreportcard-action@aa08bee4093e73fe48220e37c65c320120731284 # v1
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          # Regenerate the Markdown report alongside the badge so the report the
          # README links to always matches the current code (no hand-maintained
          # drift). The generator runs read-only here; the restricted write-back
          # job below commits both artifacts.
          report: "true"
          report_output: ".github/goreportcard-report.md"
          commit: "false"

      - run: echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"

      # Hand only the badge and its Markdown report to the write-back job. The
      # downstream job restores exactly these paths, so nothing else can enter
      # the commit.
      - name: upload generated badge artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreportcard-badge-${{ github.run_id }}
          path: |
            .github/goreportcard.svg
            .github/goreportcard-report.md
          if-no-files-found: error

  report-card-writeback:
    name: report card (restricted write-back)
    needs: [report-card-generate]
    runs-on: ubuntu-latest
    # This is the ONLY job with contents: write, and it never runs the report
    # generator. It restores only the badge artifact, stages only the
    # allowlisted path, verifies the staged set, and commits with plain git.
    permissions:
      contents: write
    # Prevent overlapping runs from committing/overwriting the badge concurrently.
    concurrency:
      group: goreportcard-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false
          cache: false

      - name: install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: download generated badge artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: goreportcard-badge-${{ github.run_id }}
          path: .

      - name: stage, verify allowlist, and commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/goreportcard.svg .github/goreportcard-report.md
          # Fail closed if anything outside the report allowlist got staged.
          ci-recipes grantseal check-writeback-allowlist
          if git diff --cached --quiet; then
            echo "badge unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "ci: update goreportcard badge [skip ci]"
          git push
