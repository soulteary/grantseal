name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Default to read-only for the whole workflow; individual jobs opt into more.
permissions:
  contents: read

env:
  CI_RECIPES_VERSION: 5f68a250b274f4673879e219c9906a91f594dd1e

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the Go version is go.mod; check-latest is
          # disabled so the toolchain is reproducible rather than tracking the
          # newest release.
          go-version-file: 'go.mod'
          check-latest: false

      - name: gofmt
        # gofmt uses LF; skip the formatting gate on Windows where CRLF
        # checkout normalization can produce spurious diffs.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -race is only run on Linux to keep the matrix fast; correctness
        # coverage on macOS/Windows runs without the race detector.
        if: runner.os != 'Linux'
        run: go test ./...

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test ./... -race

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the changed-code coverage gate can diff a PR against
          # its merge base.
          fetch-depth: 0

      # GTR runs `go test` once with the race detector and derives both test
      # stats and coverage from that single run, then enforces the gates.
      # Read-only on PRs: no write-back, no secrets. The package list excludes
      # examples/ (a tests-free demo binary). The authoritative, machine-
      # generated coverage numbers (total + per-package, with the environment of
      # record) live in .github/go-test-report.json and the rendered
      # docs/*/quality.md derived from it — do NOT hand-transcribe percentages
      # here, as prose figures drift from the source of truth. The gates below
      # (total 93 / per-package 88) are the enforced floors and sit below the
      # measured numbers with margin for macOS/Linux platform-file variance.
      - name: go test + coverage gate (GTR)
        uses: soulteary/go-test-report-action@a5e77d563843af6c7a0cc3c573640fc2cd94934a # v1.1.0
        with:
          packages: "./cmd/... ./internal/... ./pkg/..."
          race: "true"
          cover_mode: atomic
          coverage_threshold: "93"
          package_threshold: "88"
          commit: "false"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      - name: install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      # Changed-code coverage gate: a PR that adds a large chunk of untested code
      # can still clear the diluted repo-wide gate above, so additionally require
      # that changed (added/modified) non-test statements are >= 90% covered.
      # The central Go recipe computes the number from a fresh coverage profile
      # plus `git diff`. Skipped on
      # tag pushes (no meaningful PR base).
      - name: changed-code coverage gate (>=90%)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go test ./cmd/... ./internal/... ./pkg/... \
            -covermode=atomic -coverprofile=coverage.out >/dev/null
          ci-recipes grantseal check-patch-coverage coverage.out "$BASE_SHA" 90

      - name: upload raw test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-report-${{ github.run_id }}
          path: .github/test-results/
          if-no-files-found: error

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      # Scan the module (source + std lib) for known vulnerabilities. Installed
      # as a CI-only tool; it never enters the runtime go.mod dependency graph.
      # Pin the CI tool to an explicit release tag rather than a floating latest
      # so scans
      # are reproducible and a new upstream release cannot silently change
      # results. It stays a CI-only tool and never enters the runtime go.mod
      # dependency graph.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck ./...
        run: govulncheck ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      # Aggregate static-analysis gate. The enabled linter set is EXPLICIT in
      # .golangci.yml (default: none) so an upgrade cannot silently add/drop
      # linters. The action is SHA-pinned and the golangci-lint CLI version is
      # pinned so results are reproducible. This does NOT replace the go vet and
      # govulncheck steps above — they run independently.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  doc-checks:
    name: docs & sensitive files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false
          cache: false

      - name: install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: doc language (no unverifiable quality labels)
        run: ci-recipes grantseal check-doc-language .

      - name: doc consistency (no go-version matrix / stale code counts / drift)
        run: ci-recipes grantseal check-doc-consistency .

      - name: sensitive files (no private keys in tree)
        # Full-tree audit; the recipe excludes committed example keys.
        run: ci-recipes grantseal check-sensitive-files .

      # Regenerate the coverage-derived blocks in docs/*/quality.md from the
      # committed .github/go-test-report.json and fail if they drift. This makes
      # the quality docs a strict function of the machine-readable source of
      # truth rather than hand-typed numbers that can silently rot.
      - name: quality docs are in sync with the coverage source
        run: |
          ci-recipes grantseal generate-quality-docs
          if ! git diff --exit-code -- docs/enUS/quality.md docs/zhCN/quality.md; then
            echo "::error::docs/*/quality.md GENERATED-COVERAGE blocks are stale." \
              "Run ci-recipes grantseal generate-quality-docs and commit the result." >&2
            exit 1
          fi

      - name: markdown link check
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: "mlc_config.json"

  bench-smoke:
    name: benchmark smoke (compile & run once)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      - name: run benchmarks once (compile + execute, no thresholds)
        run: go test ./pkg/license ./pkg/fingerprint -run '^$' -bench . -benchtime=1x

  fuzz:
    name: fuzz (short, ${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # All four fuzz targets are smoke-run for a short time on every push/PR.
        # Longer campaigns with crash-corpus retention run in fuzz-nightly.yml.
        target:
          - FuzzParseEnvelope
          - FuzzCanonicalBytes
          - FuzzLoadRevocationList
          - FuzzRollbackStateLoad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      - name: go test -fuzz (30s)
        run: go test ./pkg/license -run=^$ -fuzz=${{ matrix.target }} -fuzztime=30s

  goreleaser-snapshot:
    name: goreleaser snapshot (no publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      - name: install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      # The .goreleaser.yaml `sboms:` stanza shells out to syft, which is a hard
      # dependency: goreleaser fails (not skips) when syft is absent from PATH,
      # even in --snapshot mode. Install the pinned syft here so this job
      # exercises the same SBOM path the real release runs. Pinned to the same
      # SHA as release.yml; CI-only, never in the runtime dependency graph.
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Exercise the full release pipeline on every push/PR WITHOUT publishing,
      # so packaging regressions are caught before a tag is cut. --snapshot needs
      # no secrets and produces nothing that leaves the runner.
      #
      # --skip=sign: the signs:/docker_signs: stanzas shell out to cosign for
      # KEYLESS (Fulcio/OIDC) signing, which is a publish-time concern — it needs
      # the id-token OIDC identity that only the tagged release job has, and
      # cosign is intentionally not installed here. Signing is exercised in the
      # real release workflow (release.yml), not in this unsigned snapshot.
      #
      # --skip=docker: goreleaser BUILDS the dockers: images even under
      # --snapshot (it only skips the push), invoking `docker buildx build
      # --load` for BOTH linux/amd64 and linux/arm64. That needs a buildx builder
      # (docker/setup-buildx-action) AND QEMU emulation (docker/setup-qemu-action)
      # for the arm64 cross-build — neither of which this job sets up, because the
      # snapshot job's purpose is to catch archive/SBOM/homebrew packaging
      # regressions, not to re-validate image builds. The full multi-arch image
      # build (with QEMU + buildx) is exercised in the real release workflow
      # (release.yml). Without this skip the job fails at the docker step
      # (`unknown flag: --load` / missing arm64 emulation).
      - name: goreleaser release --snapshot --clean
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin the GoReleaser CLI to an explicit v2 tag instead of the floating
          # "~> v2" constraint so snapshot builds are reproducible.
          version: v2.17.1
          args: release --snapshot --clean --skip=sign,docker

      - name: verify snapshot archive allowlist
        run: ci-recipes grantseal check-archive-allowlist dist

      # Guard against a GoReleaser regression that pollutes checksums.txt with
      # its own signature/certificate entries (goreleaser #6508/#6514:
      # v2.15.0–v2.15.1 wrote checksums.txt.sig back INTO checksums.txt, breaking
      # both cosign verify-blob AND `sha256sum -c`). v2.17.1's checksum pipe
      # excludes Checksum/Signature/Certificate types, so this must stay clean;
      # assert it on every push/PR so a future CLI bump that reintroduces the bug
      # fails HERE (in the unsigned snapshot) instead of at release time.
      #   - checksums.txt must NOT list itself, nor any .sig / .pem file. It MAY
      #     (and does) list the *.sbom.cdx.json documents — SBOMs are ordinary
      #     uploadable artifacts that goreleaser legitimately checksums, so they
      #     must NOT be treated as pollution.
      #   - `sha256sum -c --ignore-missing` must pass over the built artifacts
      #     (the --ignore-missing form is the exact contract the READMEs and the
      #     release workflow's post-publish verification use).
      - name: verify snapshot checksums.txt is self-consistent
        run: |
          set -euo pipefail
          cd dist
          test -f checksums.txt || { echo "error: dist/checksums.txt not produced" >&2; exit 1; }
          if grep -E '  (checksums\.txt|.*\.(sig|pem))$' checksums.txt; then
            echo "error: checksums.txt lists signature/certificate/self entries" \
                 "(GoReleaser checksum-pipe regression, see goreleaser #6508/#6514)" >&2
            exit 1
          fi
          listed_archives="$(grep -c -E '  .*(\.tar\.gz|\.zip)$' checksums.txt || true)"
          if [ "${listed_archives:-0}" -eq 0 ]; then
            echo "error: checksums.txt lists no archives" >&2; exit 1
          fi
          sha256sum -c --ignore-missing checksums.txt
          echo "snapshot checksums.txt is self-consistent ($listed_archives archives)"

  coverage-report-generate:
    name: coverage report (generate, no write)
    # Only regenerate the stable report/badge/JSON on pushes to the default
    # branch or a tag; pull requests never trigger a write-back.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/'))
    needs: [coverage]
    runs-on: ubuntu-latest
    # The report-generating Action runs strictly read-only: it must never hold
    # contents: write. It regenerates the report files in the working tree
    # (commit: false); a separate restricted job performs the commit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Regenerate .github/go-test-report.md, .github/coverage.svg, and
      # .github/go-test-report.json in-tree WITHOUT committing.
      - name: go test report (GTR, no write-back)
        uses: soulteary/go-test-report-action@a5e77d563843af6c7a0cc3c573640fc2cd94934a # v1.1.0
        with:
          packages: "./cmd/... ./internal/... ./pkg/..."
          race: "true"
          cover_mode: atomic
          coverage_threshold: "93"
          package_threshold: "88"
          commit: "false"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      - name: install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      # Stamp the environment of record (commit / time / Go version / OS-arch)
      # into the report JSON so the quality docs render it from the single
      # machine-readable source of truth instead of hand-typed prose that drifts.
      - name: inject environment of record into report JSON
        env:
          REPORT_COMMIT: ${{ github.sha }}
        run: ci-recipes grantseal inject-report-environment

      # Regenerate the coverage-derived doc blocks from the freshly stamped JSON
      # so the committed docs match the report that ships with this commit.
      - name: regenerate quality docs from report JSON
        run: ci-recipes grantseal generate-quality-docs

      # Hand only the report artifacts to the write-back job. The downstream job
      # restores exactly these paths, so nothing else can enter the commit.
      - name: upload generated report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            .github/go-test-report.json
            .github/go-test-report.md
            .github/coverage.svg
            docs/enUS/quality.md
            docs/zhCN/quality.md
          if-no-files-found: error

  coverage-report-writeback:
    name: coverage report (restricted write-back)
    needs: [coverage-report-generate]
    runs-on: ubuntu-latest
    # This is the ONLY job with contents: write, and it never runs the report
    # generator. It restores the generated artifacts, stages only the
    # allowlisted report paths, verifies the staged set, and commits with plain
    # git — so a compromised generator cannot push arbitrary files.
    permissions:
      contents: write
    # Prevent overlapping runs from committing/overwriting the report concurrently.
    concurrency:
      group: coverage-report-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false
          cache: false

      - name: install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: download generated report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report-${{ github.run_id }}
          path: .

      - name: stage, verify allowlist, and commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/go-test-report.json \
            .github/go-test-report.md \
            .github/coverage.svg \
            docs/enUS/quality.md \
            docs/zhCN/quality.md
          # Fail closed if anything outside the report allowlist got staged.
          ci-recipes grantseal check-writeback-allowlist
          if git diff --cached --quiet; then
            echo "report unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "ci: update Go test report [skip ci]"
          git push
