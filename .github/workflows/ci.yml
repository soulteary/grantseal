name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        # gofmt uses LF; skip the formatting gate on Windows where CRLF
        # checkout normalization can produce spurious diffs.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -race is only run on Linux to keep the matrix fast; correctness
        # coverage on macOS/Windows runs without the race detector.
        if: runner.os != 'Linux'
        run: go test ./...

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test ./... -race

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GTR runs `go test` once with the race detector and derives both test
      # stats and coverage from that single run, then enforces the gates.
      # Read-only on PRs: no write-back, no secrets. The package list excludes
      # examples/ (a tests-free demo binary); total gate 80 matches the measured
      # 80.51%, and the per-package gate 70 clears cmd/license-tool (70.68%).
      - name: go test + coverage gate (GTR)
        uses: soulteary/go-test-report-action@v1
        with:
          packages: "./cmd/... ./internal/... ./pkg/..."
          race: "true"
          cover_mode: atomic
          coverage_threshold: "80"
          package_threshold: "70"
          commit: "false"

      - name: upload raw test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-report-${{ github.run_id }}
          path: .github/test-results/
          if-no-files-found: error

  doc-checks:
    name: docs & sensitive files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: doc language (no unverifiable quality labels)
        run: bash scripts/check-doc-language.sh .

      - name: sensitive files (no private keys in tree)
        # Full-tree audit; the script excludes the committed example keys/ dir
        # and its own scripts/ dir to avoid false positives.
        run: bash scripts/check-sensitive-files.sh .

      - name: markdown link check
        uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"

  bench-smoke:
    name: benchmark smoke (compile & run once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: run benchmarks once (compile + execute, no thresholds)
        run: go test ./pkg/license ./pkg/fingerprint -run '^$' -bench . -benchtime=1x

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: go test -fuzz (30s)
        run: go test ./pkg/license -run=^$ -fuzz=FuzzParseEnvelope -fuzztime=30s

  coverage-report:
    name: coverage report (default branch/tag only)
    # Only regenerate and commit the stable report/badge/JSON on pushes to the
    # default branch or a tag; pull requests never get write access.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/'))
    needs: [coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Prevent overlapping runs from committing/overwriting the report concurrently.
    concurrency:
      group: coverage-report-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Regenerate .github/go-test-report.md, .github/coverage.svg, and
      # .github/go-test-report.json and commit them only when they change.
      - name: go test report + write-back (GTR)
        uses: soulteary/go-test-report-action@v1
        with:
          packages: "./cmd/... ./internal/... ./pkg/..."
          race: "true"
          cover_mode: atomic
          coverage_threshold: "80"
          package_threshold: "70"
          commit: "true"
          commit_message: "ci: update Go test report [skip ci]"
