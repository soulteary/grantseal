name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        # gofmt uses LF; skip the formatting gate on Windows where CRLF
        # checkout normalization can produce spurious diffs.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -race is only run on Linux to keep the matrix fast; correctness
        # coverage on macOS/Windows runs without the race detector.
        if: runner.os != 'Linux'
        run: go test ./...

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test ./... -race

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: go test -fuzz (30s)
        run: go test ./pkg/license -run=^$ -fuzz=FuzzParseEnvelope -fuzztime=30s
