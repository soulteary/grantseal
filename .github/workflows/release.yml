name: Release

on:
  push:
    tags:
      - "v*"

# Default read-only; the release job opts into the write scopes it needs.
permissions:
  contents: read

jobs:
  # Re-run the full quality gate at the tagged commit so a release can never be
  # cut from a state that would fail CI (tags can point at commits that never
  # went through the PR gate). This mirrors the ci.yml checks.
  gate:
    name: pre-release quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test ./... -race

      - name: fuzz smoke (all targets)
        run: |
          for t in FuzzParseEnvelope FuzzCanonicalBytes FuzzLoadRevocationList FuzzRollbackStateLoad; do
            go test ./pkg/license -run='^$' -fuzz="$t" -fuzztime=15s
          done

      - name: sensitive files
        run: bash scripts/check-sensitive-files.sh .

      # Pinned to an explicit release tag (not a floating latest) so the
      # pre-release scan
      # is reproducible; CI-only tool, never in the runtime dependency graph.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck ./...
        run: govulncheck ./...

  release:
    name: goreleaser
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required for goreleaser to create the GitHub Release
      # and upload archives/checksums.
      contents: write
      # packages: write allows pushing images to GHCR if ever needed; DockerHub
      # push uses the docker login step below.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history is required for the changelog to diff against the
          # previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      # QEMU + buildx enable multi-arch (amd64 + arm64) image builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin the GoReleaser CLI to an explicit v2 tag instead of the floating
          # "~> v2" constraint so the published release is reproducible.
          version: v2.17.1
          args: release --clean
        env:
          # GITHUB_TOKEN is used to create the release and upload artifacts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN is a PAT with write access to the
          # soulteary/homebrew-tap repository. goreleaser's brews section uses
          # it to push the generated formula to the tap (the default
          # GITHUB_TOKEN cannot write to a different repo).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: verify release archive allowlist
        run: bash scripts/check-archive-allowlist.sh dist

      # Also validate the FINAL container image contents, not just the tar.gz /
      # zip archives. goreleaser leaves the per-arch images loaded locally, so
      # inspect the amd64 image built on THIS runner: it must contain only the
      # app binary + legal files on top of the base image scaffolding.
      #
      # Pin to the exact version tag (e.g. soulteary/grantseal:1.2.3-amd64)
      # instead of the floating `latest-amd64`. The floating tag can resolve to
      # a previously published image if the freshly built one was not loaded
      # into the local docker engine, which would silently check the wrong
      # (possibly stale, differently-based) image. The `docker image inspect`
      # guard fails loudly if the just-built image is missing locally rather
      # than letting `docker create` pull an old tag from the registry.
      - name: verify release image allowlist
        run: |
          set -euo pipefail
          # goreleaser strips the leading "v" from the git tag for {{ .Version }}.
          version="${GITHUB_REF_NAME#v}"
          image="soulteary/grantseal:${version}-amd64"
          echo "checking locally-built image: $image"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            echo "error: expected locally-built image '$image' not found." >&2
            echo "The release build must load the per-arch image into the local" >&2
            echo "docker engine before this check runs." >&2
            exit 1
          fi
          bash scripts/check-archive-allowlist.sh --image "$image"

      # TODO(supply-chain): sign released artifacts and images with cosign
      # (keyless / OIDC) once the repository has an OIDC identity configured:
      #   permissions: id-token: write
      #   uses: sigstore/cosign-installer@<pinned-sha>
      #   run: cosign sign-blob / cosign sign <image>
      # TODO(supply-chain): generate and attach an SBOM (e.g. syft + goreleaser
      # `sboms:` stanza) and publish it as a release asset.
      # TODO(supply-chain): emit SLSA build provenance attestations
      # (actions/attest-build-provenance) — requires id-token: write and
      # attestations: write permissions.
