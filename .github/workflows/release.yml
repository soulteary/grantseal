name: Release

# Three entry points, all funnel into the SAME build -> verify -> publish ->
# attest -> promote pipeline:
#   1. push a `v*` tag          -> classic tag-driven release (atomic draft flow)
#   2. publish a GitHub Release -> the web UI "Draft a new release" / "Publish"
#                                  path; the Release already exists, so
#                                  goreleaser uploads assets to it and the final
#                                  promote step is a harmless no-op.
#   3. manual workflow_dispatch -> run from the Actions tab against a chosen tag.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.3)"
        required: true
        type: string

# Serialize releases per tag so the tag-push and release-published events that
# a single web release can emit cannot run the pipeline twice concurrently.
concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Default read-only for the whole workflow; the release job opts into the write
# scopes it needs, and the supply-chain attestation step opts into the narrow
# id-token / attestations scopes ONLY where required.
permissions:
  contents: read

jobs:
  # Resolve the ONE tag this run releases, regardless of which event triggered
  # it, and expose it (with and without the leading `v`) to every downstream
  # job. This is the single source of truth that replaces the raw
  # GITHUB_REF_NAME, which is the branch name (not a tag) under
  # workflow_dispatch.
  setup:
    name: resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release)           tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            push)              tag="$REF_NAME" ;;
            *)                 tag="$REF_NAME" ;;
          esac
          if [ -z "$tag" ]; then
            echo "error: could not resolve a release tag for event '$EVENT_NAME'" >&2
            exit 1
          fi
          case "$tag" in
            v*) : ;;
            *)  echo "error: release tag '$tag' must start with 'v'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "releasing tag: $tag (version ${tag#v})"

  # Re-run the full quality gate at the tagged commit so a release can never be
  # cut from a state that would fail CI (tags can point at commits that never
  # went through the PR gate). This mirrors the ci.yml checks.
  gate:
    name: pre-release quality gate
    needs: [setup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always gate the code at the tag being released, not whatever branch
          # a workflow_dispatch happened to run from.
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test ./... -race

      - name: fuzz smoke (all targets)
        run: |
          for t in FuzzParseEnvelope FuzzCanonicalBytes FuzzLoadRevocationList FuzzRollbackStateLoad; do
            go test ./pkg/license -run='^$' -fuzz="$t" -fuzztime=15s
          done

      - name: sensitive files
        run: bash scripts/check-sensitive-files.sh .

      # Pinned to an explicit release tag (not a floating latest) so the
      # pre-release scan
      # is reproducible; CI-only tool, never in the runtime dependency graph.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck ./...
        run: govulncheck ./...

      # Prove the release allowlist gate still rejects planted material before we
      # rely on it below (P1-4 self-test).
      - name: archive/image allowlist gate self-test
        run: bash scripts/check-archive-allowlist-selftest.sh

  # -------------------------------------------------------------------------
  # Atomic release (P1-3): BUILD -> VERIFY (same bytes) -> PUBLISH -> ATTEST.
  #
  # The release is BUILT first with publishing fully disabled (`--skip=publish`),
  # so goreleaser produces the exact archives, checksums, SBOMs and per-arch
  # container images WITHOUT creating a GitHub Release, pushing any image tag, or
  # updating any floating tag (`latest`, `<major.minor>`). Those built bytes are
  # then VERIFIED in place (archive + image allowlist, SHA-256 hashing, SBOM
  # presence, `license-tool version` smoke test, and a deliberately-planted
  # extra-file self-test that MUST block publish). Only after every check passes
  # do we PUBLISH: goreleaser re-runs and, because the build is deterministic
  # (`-trimpath` + pinned ldflags), re-produces byte-identical archives — which
  # we assert via a SHA-256 comparison against the pre-verification checksums
  # before anything becomes visible. The GitHub Release is created as a DRAFT
  # (release.draft: true in .goreleaser.yaml), so its tag/notes/assets stay
  # invisible to consumers until the final PROMOTE step flips it to published,
  # which runs last, after attestation. On any failure the draft is never
  # promoted and floating image tags are never reached, so consumers never see a
  # half-verified release.
  # -------------------------------------------------------------------------
  release:
    name: goreleaser (build -> verify -> publish)
    needs: [setup, gate]
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the tag/version across every step below,
      # resolved by the setup job so it is correct under push, release and
      # workflow_dispatch alike (GITHUB_REF_NAME is a branch under dispatch).
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
      RELEASE_VERSION: ${{ needs.setup.outputs.version }}
      # True when the run was triggered by publishing a GitHub Release from the
      # web UI: the Release already exists (and is already visible), so
      # goreleaser must upload assets to it rather than create a fresh draft.
      RELEASE_PREEXISTS: ${{ github.event_name == 'release' }}
    permissions:
      # contents: write is required for goreleaser to create the (draft) GitHub
      # Release and upload archives/checksums.
      contents: write
      # packages: write allows pushing images to GHCR if ever needed; DockerHub
      # push uses the docker login step below.
      packages: write
      # id-token: write is required for cosign keyless (Fulcio/OIDC) signing and
      # for build-provenance attestation; attestations: write lets
      # attest-build-provenance record the attestation. These are scoped to this
      # single publishing job — the workflow default stays read-only.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact tagged commit (not the dispatch branch), and keep
          # full history so the changelog can diff against the previous tag.
          ref: ${{ needs.setup.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: false

      # QEMU + buildx enable multi-arch (amd64 + arm64) image builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Supply-chain tooling (P1-6). cosign performs keyless signing of
      # checksums/archives/images; syft generates the CycloneDX SBOM consumed by
      # goreleaser's `sboms:` stanza. Both are CI-only and never enter the
      # runtime dependency graph.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign to an explicit v3 release for reproducible signing and to
          # avoid silently upgrading into a future v3/v4 that changes sign-blob
          # defaults again. The .goreleaser.yaml signs: stanzas use v3 flags
          # (--new-bundle-format=false, --use-signing-config=false) to keep
          # emitting the detached .sig + .pem pair documented in the READMEs.
          cosign-release: v3.1.3

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # ---- BUILD (no publish): exact artifacts, nothing pushed/visible --------
      # `--skip=publish` disables the GitHub Release, all image pushes (including
      # floating tags), Homebrew tap push, signing and announcements. Images are
      # still BUILT and loaded into the local docker engine so the image
      # allowlist can inspect the real, about-to-be-shipped filesystem.
      # `--skip=sign` here because keyless signing must not run until publish
      # time (it also needs the artifacts to be the final, pushed ones).
      - name: goreleaser build (no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin the GoReleaser CLI to an explicit v2 tag instead of the floating
          # "~> v2" constraint so the published release is reproducible.
          version: v2.17.1
          args: release --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- VERIFY the exact built bytes --------------------------------------
      - name: record pre-publish artifact hashes
        run: |
          set -euo pipefail
          # Snapshot the SHA-256 of every release ARCHIVE built above. The
          # publish phase rebuilds deterministically (-trimpath + pinned ldflags
          # + mod_timestamp) and must reproduce these exact archive bytes before
          # anything is promoted (P1-3 / same-bytes guarantee).
          #
          # Deliberately EXCLUDE checksums.txt from this same-bytes assertion.
          # checksums.txt is an AGGREGATE, derived file — its contents depend on
          # the SET of artifacts present when goreleaser computes it. The BUILD
          # phase runs with `--skip=publish,sign` (no signatures/SBOM-signing
          # side effects), while the PUBLISH phase runs the full pipeline; the
          # two phases legitimately produce different checksums.txt bytes even
          # though every ARCHIVE is byte-identical. Hashing checksums.txt here
          # made the same-bytes check fail with "./checksums.txt: FAILED" while
          # all archives were OK. The published checksums.txt is instead verified
          # for correctness by the post-publish closed-loop step below (cosign
          # verify-blob + `sha256sum -c --ignore-missing`).
          #
          # Write the snapshot OUTSIDE the git work tree ($RUNNER_TEMP). The
          # publish phase re-runs `goreleaser release --clean`, which refuses to
          # run if the work tree is dirty; a stray untracked file here (e.g.
          # pre-publish.sha256) would trip that check and abort the release.
          ( cd dist && find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \) \
              -print0 | sort -z | xargs -0 sha256sum ) > "$RUNNER_TEMP/pre-publish.sha256"
          echo "pre-publish archive hashes:"
          cat "$RUNNER_TEMP/pre-publish.sha256"

      - name: verify release archive allowlist
        run: bash scripts/check-archive-allowlist.sh dist

      # Validate the FINAL container image contents, not just the tar.gz / zip
      # archives. goreleaser leaves the per-arch images loaded locally; inspect
      # the amd64 image built on THIS runner. It must contain only the app binary
      # + legal files on top of the pinned distroless base (exact-path allowlist;
      # see scripts/check-archive-allowlist.sh). Pin to the exact version tag
      # (soulteary/grantseal:1.2.3-amd64), not the floating latest-amd64, so a
      # missing local build fails loudly instead of silently inspecting a stale
      # registry image.
      - name: verify release image allowlist
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          image="soulteary/grantseal:${version}-amd64"
          echo "checking locally-built image: $image"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            echo "error: expected locally-built image '$image' not found." >&2
            echo "The release build must load the per-arch image into the local" >&2
            echo "docker engine before this check runs." >&2
            exit 1
          fi
          bash scripts/check-archive-allowlist.sh --image "$image"

      # Pipeline self-test (P1-4): copy a real archive, inject a stray file, and
      # assert the allowlist check FAILS on it. This proves the gate that guards
      # publish actually blocks a tampered artifact — if this ever passes, the
      # release is aborted before anything is published.
      - name: pipeline tamper self-test (planted file must block publish)
        run: |
          set -euo pipefail
          tamper_dir="$(mktemp -d)"
          src="$(find dist -maxdepth 1 -name '*.tar.gz' | head -n1)"
          if [ -z "$src" ]; then
            echo "error: no archive found to tamper-test" >&2; exit 1
          fi
          work="$(mktemp -d)"
          tar -xzf "$src" -C "$work"
          echo "PLANTED" > "$work/private.key"
          ( cd "$work" && tar -czf "$tamper_dir/tampered.tar.gz" . )
          if bash scripts/check-archive-allowlist.sh "$tamper_dir"; then
            echo "error: allowlist accepted a tampered archive with private.key" >&2
            exit 1
          fi
          echo "pipeline tamper self-test passed: planted private.key blocks publish"

      - name: binary smoke test (license-tool version)
        run: |
          set -euo pipefail
          # Extract the linux/amd64 binary from the just-built archive and run it.
          version="$RELEASE_VERSION"
          arch_tar="dist/grantseal_${version}_linux_amd64.tar.gz"
          if [ ! -f "$arch_tar" ]; then
            arch_tar="$(find dist -maxdepth 1 -name 'grantseal_*_linux_amd64.tar.gz' | head -n1)"
          fi
          test -n "$arch_tar" && test -f "$arch_tar"
          smoke="$(mktemp -d)"
          tar -xzf "$arch_tar" -C "$smoke"
          "$smoke/license-tool" version
          "$smoke/license-tool" version | grep -q "$version" || {
            echo "error: license-tool version output does not contain '$version'" >&2
            exit 1
          }

      - name: verify SBOM was generated
        run: |
          set -euo pipefail
          if ! find dist -maxdepth 1 -name '*.sbom.cdx.json' | grep -q .; then
            echo "error: no CycloneDX SBOM (*.sbom.cdx.json) found in dist/" >&2
            exit 1
          fi
          echo "SBOM(s) present:"; find dist -maxdepth 1 -name '*.sbom.cdx.json'

      # ---- PUBLISH (only after every check above passed) ----------------------
      # Clean slate on the pre-existing Release (web-UI `release: published`
      # trigger only). When a release is drafted/published from the web UI, the
      # Release already exists and MAY carry assets from an earlier attempt or a
      # hand-upload (e.g. a stale checksums.txt). goreleaser's
      # `replace_existing_artifacts: true` overwrites assets it produces, but a
      # leftover asset whose NAME differs from anything in this build would
      # survive — and a consumer who downloads the whole release then runs
      # `sha256sum -c checksums.txt` sees that stale file mismatch as a FAILED
      # line. Delete every existing asset first so the published set is exactly
      # what THIS verified build produces. No-op for tag-push / workflow_dispatch
      # runs (goreleaser creates a fresh draft, so there is nothing to purge).
      - name: purge stale assets on pre-existing release (web-UI trigger)
        if: env.RELEASE_PREEXISTS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          echo "purging pre-existing assets from release $tag before publish"
          # `gh release view` lists asset names; delete each so goreleaser
          # re-uploads a clean, self-consistent set. Tolerate an empty list.
          assets="$(gh release view "$tag" --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"
          if [ -z "$assets" ]; then
            echo "no pre-existing assets to purge"
          else
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              echo "deleting stale asset: $name"
              gh release delete-asset "$tag" "$name" --yes || true
            done <<<"$assets"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Re-run goreleaser to PUBLISH: upload archives/checksums/SBOMs, push
      # per-arch + manifest image tags, and cosign keyless-sign
      # checksums/archives/images. On tag-push / workflow_dispatch runs the
      # GitHub Release is created as a DRAFT (release.draft: true) and stays
      # invisible until the PROMOTE step. On a web-triggered `release:
      # published` run the Release already exists, so goreleaser uploads the
      # assets onto it (replace_existing_artifacts handles a re-run). COSIGN_YES
      # answers the Fulcio/Rekor consent prompt.
      - name: goreleaser publish (release + signed push)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          COSIGN_YES: "true"

      # Same-bytes guarantee (P1-3 / B4): assert the deterministically-rebuilt
      # ARCHIVES are byte-identical to the ones we verified above. Any drift
      # means the published archive bytes differ from the checked bytes, so we
      # abort BEFORE promoting the draft to visible. checksums.txt is NOT part of
      # this assertion (see the record step above) — it is an aggregate derived
      # file whose bytes legitimately differ between the build and publish
      # phases; its correctness is verified by the post-publish closed-loop step.
      - name: assert published archives match verified archives (SHA-256)
        run: |
          set -euo pipefail
          # The snapshot lists archive paths relative to dist/ (recorded from
          # inside dist above), so verify from there against the out-of-tree
          # snapshot.
          ( cd dist && sha256sum -c "$RUNNER_TEMP/pre-publish.sha256" )
          echo "verified: published archives match the pre-publish hashes"

      # Post-publish closed-loop verification (P1-3 / P1-6): download the assets
      # that a CONSUMER actually gets from the GitHub Release and run the exact
      # verification contract documented in the READMEs against them. This is the
      # authoritative check that the release someone downloads is signed and
      # internally consistent — it catches problems the local dist/ self-compare
      # above cannot (a bad upload, a stale/duplicate asset left on the release,
      # a signature that doesn't match the published checksums file, etc.).
      #
      # It deliberately mirrors README "Verify" section 1:1:
      #   1. cosign verify-blob the published checksums.txt against its published
      #      .sig/.pem, pinning our release-workflow OIDC identity.
      #   2. sha256sum -c --ignore-missing checksums.txt over the downloaded
      #      archives. --ignore-missing is REQUIRED: the download dir also holds
      #      the .sig/.pem/.sbom.cdx.json/checksums.txt files, which are NOT (and
      #      must not be) listed in checksums.txt; without it sha256sum would
      #      error on those "unlisted"/"missing" entries. It ALSO means we assert
      #      at least one archive was actually checked (guard below), so an empty
      #      or truncated download can't pass vacuously.
      # Runs on the freshly-published (draft or web) release BEFORE promote, so a
      # failure here leaves an un-promoted draft that never reaches consumers.
      - name: verify published release (cosign + checksums, consumer path)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          verify_dir="$(mktemp -d)"
          echo "downloading published assets for $tag into $verify_dir"
          # Draft releases are downloadable by this token (it created them); a
          # web-published release is public. Grab everything attached.
          gh release download "$tag" --dir "$verify_dir" --clobber

          cd "$verify_dir"
          test -f checksums.txt || { echo "error: checksums.txt missing from release $tag" >&2; exit 1; }
          test -f checksums.txt.sig || { echo "error: checksums.txt.sig missing from release $tag" >&2; exit 1; }
          test -f checksums.txt.pem || { echo "error: checksums.txt.pem missing from release $tag" >&2; exit 1; }

          echo "1/2: cosign verify-blob checksums.txt"
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp '^https://github.com/soulteary/grantseal/\.github/workflows/release\.yml@refs/tags/v.*$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            checksums.txt

          echo "2/2: sha256sum -c --ignore-missing checksums.txt"
          # Confirm the manifest lists at least one archive AND that all listed,
          # present files match. --ignore-missing skips the sig/pem/sbom files
          # that legitimately are not in the manifest.
          listed_archives="$(grep -c -E '  .*(\.tar\.gz|\.zip)$' checksums.txt || true)"
          if [ "${listed_archives:-0}" -eq 0 ]; then
            echo "error: checksums.txt lists no archives" >&2; exit 1
          fi
          sha256sum -c --ignore-missing checksums.txt
          echo "published release $tag verified: checksums signed and consistent ($listed_archives archives)"

      # ---- ATTEST (build provenance / SLSA) ----------------------------------
      # Attest the released archives + checksums. Uses the job-scoped
      # id-token/attestations permissions above.
      - name: attest build provenance (release archives)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Attest the pushed multi-arch image by digest and record the attestation
      # in the registry so `gh attestation verify` / `cosign` consumers can
      # verify provenance. The digest is read from goreleaser's artifacts.json.
      - name: resolve pushed image digest
        id: imgdigest
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          # goreleaser records docker manifests + their digests in metadata.
          digest="$(docker buildx imagetools inspect "soulteary/grantseal:${version}" \
            --format '{{ json .Manifest.Digest }}' 2>/dev/null | tr -d '"' || true)"
          if [ -z "$digest" ]; then
            echo "note: could not resolve manifest digest; skipping image attestation" >&2
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: attest build provenance (container image)
        if: steps.imgdigest.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/soulteary/grantseal
          subject-digest: ${{ steps.imgdigest.outputs.digest }}
          push-to-registry: true

      # ---- PROMOTE (final visibility flip) -----------------------------------
      # The ONLY step that makes the tag/release/assets visible to consumers.
      # Runs last, so a failure in any prior verify/publish/attest step leaves
      # the release as an invisible draft that can be discarded.
      #
      # For tag-push / workflow_dispatch runs goreleaser created a DRAFT, so
      # this flips it to published. For a web-triggered `release: published`
      # run the Release is already visible and NOT a draft; `--draft=false` is
      # then a harmless idempotent no-op that simply reasserts the published
      # state.
      - name: promote draft release to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [ "$RELEASE_PREEXISTS" = "true" ]; then
            echo "release '$tag' was published from the web UI; reasserting published state (no-op)"
          else
            echo "promoting draft release $tag to published"
          fi
          gh release edit "$tag" --draft=false
