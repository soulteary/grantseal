name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: write is required for goreleaser to create the GitHub Release
  # and upload archives/checksums.
  contents: write
  # packages: write allows pushing images to GHCR if ever needed; DockerHub
  # push uses the docker login step below.
  packages: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for the changelog to diff against the
          # previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      # QEMU + buildx enable multi-arch (amd64 + arm64) image builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # GITHUB_TOKEN is used to create the release and upload artifacts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN is a PAT with write access to the
          # soulteary/homebrew-tap repository. goreleaser's brews section uses
          # it to push the generated formula to the tap (the default
          # GITHUB_TOKEN cannot write to a different repo).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
