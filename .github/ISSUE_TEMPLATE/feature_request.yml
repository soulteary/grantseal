name: Feature request
description: Suggest an enhancement. Keep the runtime standard-library only.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        How might it work? Note any impact on schema_version, stable LICENSE_*
        codes, the CLI, or the exported Go API (see COMPATIBILITY.md).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require adding a third-party runtime dependency.
        - label: This does not weaken a fail-closed default.
